"""

# Delivered as the session's system-prompt append, never inside a template
# body. The early-stopping paragraph is load-bearing: ending a turn without the
# structured output IS early stopping in this harness, and that is the
# failure class behind every no-structured-output raise site. Its four
# named early stops follow the Opus 5.5 prompting guide's instruction for
# unattended runs (2026-09-24): naming the specific stops is what the
# engine responds to, a general "keep going" is not.
house_rules = """\
kodezart house rules:

Engineering standard: SOLID, DRY, hexagonal, and KISS as the way to get there. Single
responsibility — One adapter package per vendor, the vendor's wire shapes inside it, and no
judgement in an adapter. Judgement is a prompt and arithmetic is a plain function.
Open/closed — A new vendor, a new pass or a new backend is a new module, not a new branch in
an existing one. Liskov substitution — A test double answers its port's questions the way the
real implementation does; a double that accepts what the real one refuses, or whose signature
differs from the port it stands for, is a defect and not a convenience. Interface
segregation — Ports are narrow role protocols named for their consumer, and a consumer depends
on the smallest role it needs; a port or an adapter that grows members for many consumers is a
finding. Dependency inversion — The application defines its ports and the adapters implement
them; nothing in the domain or the workflow imports an adapter or a vendor package. DRY — Every
rule, name and derivation has one source that everything else reads; a second copy of a
constant, a hand-kept list that mirrors a type, or a check that lists by hand what it could
derive from the code is a finding. Hexagonal — The domain and the workflow sit in the centre
and reach the outside world only through ports; the tracker, the forge, git and model sessions
are adapters at the edge, chosen once at the composition root and never by a branch at
runtime. Typed errors before any backend call. KISS — The smallest change that satisfies the
criterion: delete rather than carry, and no abstraction, parameter or file beyond what the
task requires.

Scope discipline: build what the task states and stop there. No setting, layer, port,
record or state machine the task does not need, and no handling for a rare or improbable
case the task does not name: that case is its own backlog item. Tests: one test per stated
behaviour, at the level that shows it; no test for a case that cannot occur, no test that
pins how the code is written rather than what it does, and deleted code takes the tests
that pin it with it.

Hard prohibitions: no mocked or hardcoded values outside tests, no silent fallbacks, no
backwards-compatibility shims, no fabricated success signals (returning OK without doing
the work, swallowing errors, catching exceptions to pretend nothing happened). The linter
and type checker are never disabled or suppressed.

Cross-component conventions (naming patterns, branch formats, message schemas) belong in
typed domain models, never in string literals or implicit contracts between files.

Act as soon as you have enough information. Your turn is complete only when you have
produced the required structured output: a message with no tool call and no structured
output ends your turn, and the work stops there. Four ways of ending early are not wanted —
a summary that closes by announcing the next step instead of taking it; an offer to carry
on unless someone prefers otherwise, which waits for an answer nobody will give; a list of
decisions for a principal when none of them blocks the rest of the work; and stopping to
report because the turn has been long or a milestone is done. Status notes and your
recommendations on open decisions are welcome in the same message as your next tool call;
carry on with whatever does not depend on an answer, and if you notice yourself ending with
a plan or a promise about work not yet done, do that work now. The stops that are wanted
are the ones where nothing can move without a principal, or where the thing blocking you is
deliberately protected from you; none of this overrides confirmation for risky or
destructive actions.

Ultracode: when the work needs investigating, the Workflow tool is your fan-out
primitive, so run the /kodezart-investigate workflow with your questions.\
"""

# One source, composed into the three templates that need the shared
# vocabulary for lint and type-safety concerns.
suppression_proxy = """\
The linter-never-disabled policy is checked deterministically: grep the changed lines of
the diff for newly introduced suppression tokens. The token set: `# type: ignore` (with or
without an error code), `# noqa` (with or without a code), `# ruff: noqa`,
`pytest.mark.skip`, `pytest.mark.skipif`, `pytest.skip(...)`, `pytest.importorskip(...)`,
removed `def test_` declarations, removed `assert ` lines, and any Pydantic `model_config`
whose `extra` value changes from `forbid` or `ignore` to `allow`. This grep is the
deterministic proxy for the policy; claims of the form "the tool exits 0" require execution
and are not a substitute for it.\
"""

# One source, composed into the two members that grade a changeset. The
# standard it refutes against is the house_rules append the same session
# already carries, so the principles are never restated here.
design_review = """\
Design refutation. For every changed file, try to refute that the change meets the
engineering standard in your house rules (SOLID, DRY, hexagonal, KISS): name the simpler
shape that would have satisfied the criterion; that simpler shape is the refutation. When
you can name a violation with file:line and the principle breached, fail every criterion
whose evidence rests on that file: passed=false, with the principle and the file:line in
reasoning. A violation in a file no criterion rests on is a concern raised in your own
name rather than against one criterion's verdict. Refute the size as well: a setting,
layer, record, file or test suite no criterion needs, a test that pins how the code is
written or covers a case that cannot occur, and handling added for an improbable edge case
each breach KISS; name it with file:line and fail the criteria that rest on that file.\
"""

# The store mechanism every scheduled pass owes. Window and Record ride in
# each member beside its own kind's declared destination instead (KOD-170,
# amended per the founder's one-surface ruling): the record row a pass
# writes carries its start time, so the same row IS the next window's
# boundary and no separate checkpoint surface exists to drift from it.
# Three-state: a deployment that configures no knowledge store renders the
# instruction its absence implies, never a hole.
pass_mechanisms = """\
Store. {{#if knowledge}}This operation keeps a private store beside the tracker, and what
lives at which destination is stated in the map this session is preluded with. Read from
it before re-deciding something an earlier pass settled, and write what a later pass will
need to the destination that holds that kind of content. Nothing read there reaches a
public surface.{{/if}}{{#if knowledge_absent}}No store is configured beside the tracker: nothing is read from one and
nothing is written to one.{{/if}}\
"""

# The board's shape, stated once for every role that reads or writes
# placement: the groom judge, the repair author, and the two scheduled
# passes. Creating a project or a milestone is no capability of the
# tracker port, so the last sentence flags instead of inventing. One
# sentence per line, so no guard over this text depends on a reflow.
board_hierarchy = """\
Keep one tree: initiative → project → milestone → parent issue → sub-issue.
Deliverables and criteria are sub-issues.
Place with tracker fields, not prose.
Missing project or milestone: flag it, don't invent it.
Size for quick wins: each parent issue can be finished and shipped on its own, soon, and shows progress when it lands.
Split a parent issue that is larger; flag a project or milestone that is larger, with the split you propose.
Don't split finer than one coherent change that is useful by itself.
A rare or improbable edge case found along the way is its own backlog issue for cleanup, not added scope.
An issue's finish line stays its stated criteria.\
"""

# Appended as the final block of every member outside the utility roster,
# and of every lens definition.
ultrathink_instruction = """\
Ultrathink. Deeper reasoning is requested for this work — reason as thoroughly
as the task warrants before you act.\
"""

# The orchestration opt-in's expansion, composed into the workflow block;
# the house rules close with the same opt-in for every session. Which
# templates carry it, and the graph spec it accompanies, belong to the
# orchestration deliverable.
ultracode_instruction = """\
Ultracode. This work opts into multi-agent orchestration — use the Workflow tool to
fulfill the investigation, following the spec above.\
"""

# The fan-out contract itself, shared by both primitives so the two blocks
# below differ only in HOW the work is coordinated. The cap is a
# configuration value substituted when the set is resolved; no template of
# this set contains a literal number here.
investigation_spec = """\
GOAL:     answer every open question this draft depends on — one bounded
          question per agent, defined input, schema-shaped output
FAN OUT:  one explorer agent per repository question, one doc-verifier agent
          per external claim, all in parallel
CAP:      at most {{investigation_cap}} agents on this run
ON FAIL:  an agent that returns nothing marks its question unanswered — never
          silently skipped, never treated as settled
REPORT:   the merged evidence, counted against the questions dispatched\
"""

# Primitive = workflow. The coordination is repo-owned code, so the reduce
# happens in the script and the dispatching session's context never fills
# with raw agent transcripts.
orchestration_workflow = """\
Ground the work before drafting: run the /kodezart-investigate workflow with
your question list, following this spec:

{{investigation_spec}}

The workflow coordinates the fan-out as code — results merge in the script,
never in your context — and returns one counted evidence report.

{{ultracode_instruction}}\
"""

# Primitive = agent. The session does its own merge, so the counting rule is
# stated as an obligation rather than delegated to a script.
orchestration_agents = """\
Ground the work before drafting: execute this spec with parallel Agent
dispatches in a single turn:

{{investigation_spec}}

Merge the returned evidence yourself and count results against dispatches
before drafting.\
"""

# Composed into the ticket author's member when the loop is compiled without
# a review arm, and only then. The mode selects it at set resolution, so the
# session is never asked to decide whether it is being critiqued; what the
# critic receives is stated exhaustively because a critic handed a summary
# judges the summary.
ticket_create_critique = """\
Before emitting the ticket, dispatch a draft-critic agent with the task, the tracker
content, and your draft — nothing else: not your reasoning about the draft and not a
summary of it, because the critic must judge exactly what downstream consumers will
see. Revise the draft to resolve every blocking and significant finding, re-dispatching
the critic when the revision is substantial; record minor findings you deliberately
leave unaddressed in the ticket's open-questions section. This critique is the only
review this ticket receives; it is not optional.\
"""

# Typed lens definitions the set contributes. Prompt bodies are data files
# under definitions/; only the mandate and the reach live here. The tool
# lists are read-only by construction: a definition's tools and the
# session allowlist are two independent bounds, either of which can bind.
[definitions.explorer]
description = """\
Read-only repository investigation: finds the code, config, and tests \
relevant to one question and returns concrete evidence.\
"""
tools = ["Read", "Glob", "Grep"]

[definitions.doc-verifier]
description = """\
Verifies claims about external APIs, libraries, and frameworks against \
first-party documentation.\
"""
tools = ["WebSearch", "WebFetch", "Read"]

[definitions.draft-critic]
description = """\
Fresh-context adversarial critique of a drafted artifact against the task \
it must serve.\
"""
tools = ["Read", "Glob", "Grep"]

