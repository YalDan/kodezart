# Prompt set metadata. Parsed with stdlib tomllib by InRepoPromptRegistry.
# Unknown top-level keys and unknown sections are a typed boot error;
# new sections are added by extending PromptSetMetadata additively.

name = "claude-opus"

engines = ["claude-opus"]

# Set-level fragment content. The registry binds {{skills_reference}} in every
# member from this header plus the member key's [skills] loadout; a key with an
# empty loadout binds the fragment to the empty string.
[fragments]
skills_reference_header = """\
── SKILLS AVAILABLE FOR THIS ROLE ──
Load each skill below when its subject matter is in play; ignore the ones \
that do not apply.\
"""

# Function key -> skill names the role should reach for. Declared for every
# key; an explicit empty list means the role loads no skills.
[skills]
branch_name = []
ticket_create = ["code-review"]
ticket_review = ["code-review", "security-review"]
ticket_revision = []
acceptance_criteria = ["code-review"]
criteria_validation = ["code-review"]
implementation = ["code-review"]
evaluation = ["code-review", "security-review"]
iteration_feedback = ["code-review"]
post_merge_review = ["code-review", "security-review"]
fix = ["code-review"]
remediation_ticket = ["code-review"]
commit_message = []
pr_description = []
fire_prep_pass = []
grooming_pass = []
content_audit = []
write_back_verify = ["code-review"]
knowledge_map = []

organize_assess = ["code-review"]
organize_author = ["code-review"]
organize_verify = ["code-review"]
organize_criteria_author = ["code-review"]

# Shared native Organize rubric sources. These are selected per call by an
# existing PromptKey and are never composed into the associated session body.
[rubrics]
grooming_pass = """
Judge organizational readiness across the current scope, not dry implementation.
All four conditions must hold; failure of any one prevents GROOM convergence:
1. Blockers are organized across projects, milestones, issues and sub-issues.
   Check actual dependencies, ownership and ordering across container boundaries.
2. Every open decision has been asked of its owner with the unresolved choice
   explicit. An agent's opinion or an unasked question is not a human ruling.
3. Dates, deadlines, priorities and execution order have been verified against
   current source evidence. Missing evidence is not a successful verification.
4. Every issue ends in a measurable statement of its own goal, with an observable
   completion condition. A vague activity or another issue's goal does not suffice.
Inspect all four conditions, including the instructions that cause defects to
recur. Name each failing condition and its concrete current evidence. Report
repairable organizational gaps as spec_gap; reserve human_decision for an actual
unresolved choice. Use buildable only when this organizational rubric holds.
This judgment grants no write authority and never supplies human scope approval.
"""
ticket_review = """
Judge whether this issue can be implemented from its own specification without
inventing a decision, and demonstrated in its declared grading environment.
Try a dry implementation: require evidence-grounded context, falsifiable
requirements, a concrete verification story, self-sufficient inputs, real
source-backed dependency edges, and traceable provenance. Identify omitted
interfaces, ambiguous criteria, missing call sites and contradictions with the
committed design. A body meeting only a label or a general quality heading is
insufficient. Report the precise invented choice and distinguish a repairable
spec_gap from a human_decision; never invent the missing choice.
"""
criteria_validation = """
Judge the native criterion sub-issues against the issue specification and the
actual repository base. Each criterion must have a concrete feasible Check and
Do, a stable native identity, and an observable verification story. Preserve
criterion identities and judge the conjunction: independently feasible criteria
must also be jointly satisfiable. Reject criteria outside the declared task or
requiring a forbidden behavior. Missing evidence is unverifiable, with the actual
missing artifact and existing pending blocker identified; the caller checks that
edge. Do not manufacture an authored-ticket artifact or prior validation result.
A criterion set is admitted only under this feasibility and conjunction rubric.
"""
