# Annotated example operation config.
#
# Pointed at by KODEZART_OPERATION_CONFIG. Parsed with stdlib tomllib; no new
# dependency. This file is ORG-SHAPED runtime configuration — deployment and
# infrastructure knobs live in AppConfig (env), cadence lives in scheduler
# configuration, and per-fire parameters are request fields. Secrets NEVER
# appear here: the model is extra="forbid", so a stray token key fails at load.
#
# This is the COMPLETE example: every field the model carries, annotated.
# Only operation_name and workspace are required — every collection defaults
# empty and an empty board boots (docs/operation.minimal.toml is that floor).
# Validation is structural, applies to what IS present, and collects every
# failure into one typed error; existence resolution against the live
# workspace belongs to the tracker adapter, not to config load. A consumer
# needing a member an empty collection cannot supply refuses at the point of
# need, naming the missing role or key and what stops working.

# Human-readable name of the operation these settings describe.
operation_name = "example-operation"

# The tracker workspace the operation acts within. A slug, not a URL.
workspace = "example-workspace"

# Identities the agent posts under, in the order the pass templates address
# them: the mention handle first, the account's plain name second. Must not
# collide with a principal.
agent_identities = ["@example-agent", "example-agent"]

# Prose describing the CLASS of thing this operation treats as private, read
# by the judgment half of the outbound gate. A CLASS, never a list of
# instances: an instance list stops at what the operator remembered to
# enumerate, and writing the instances down here would publish the very
# strings the gate exists to withhold. Omitting the field is legal and means
# the operator has supplied no description; enabling
# KODEZART_AGENTIC_CONTENT_SCANNER_ENABLED without one aborts boot.
private_surface = "Anything identifying the people, customers or commercial arrangements behind this operation: personal and customer names, private workspace and document addresses, revenue and pricing figures, and unreleased capabilities described by what they do rather than by their public name."

# Authority is enforced by ROLE, never by name in code or templates.
# When principals are declared, EXACTLY ONE carries `approver` and AT MOST
# ONE carries `assignee`; every principal carries `principal`. All three are
# validated at load over what is present. An absent `assignee` loads — the
# pass that assigns prepared work refuses at the point of need instead.
#
# Three roles, because the passes route three things differently:
#   approver  — holds the approval flip
#   principal — their word creates a reply obligation the queue does not record
#   assignee  — prepared fires, triage filings and decision flags are assigned here
#
# `roles` is a SET, not one value: one principal routinely holds two, and a
# single-valued field would force either a duplicate entry or a lost routing.
#
# `tracker_user` is the identifier AUTHORITY is checked against; `handle` is the
# identifier a MENTION is recognised by — the string a person writes when
# addressing this principal. They are routinely different, and the mention sweep
# is text matching with nothing but `handle` to match on. Handles are unique and
# must not collide with an agent identity. `forge_handle` is the same principal's
# name on the FORGE, where review-borne mentions are answered; omit it for a
# principal who never appears there.
[[principals]]
tracker_user = "example-approver"
roles = ["approver", "principal", "assignee"]
handle = "@example-approver"
forge_handle = "example-approver-on-forge"

[[principals]]
tracker_user = "example-contributor"
roles = ["principal"]
handle = "@example-contributor"
forge_handle = "example-contributor-on-forge"

[[principals]]
tracker_user = "example-oncall"
roles = ["principal"]
handle = "@example-oncall"

# Teams addressed from templates by key. Each entry carries the team's
# display name and its short tracker key — the identifier issues are
# prefixed with. A rendered prompt that names one cannot derive the other,
# so both are declared.
#
# `repository` names the `[[repos]]` entry this team's issues are fired
# into, and it must be one of the urls declared below. It is REQUIRED here
# because this example declares two repositories: each repository's
# dispatch tick scans only the teams bound to it, so a team bound to none
# would have its issues fired into whichever tick claimed them first. An
# operation declaring exactly ONE repository omits the field entirely —
# every team binds to the only candidate there is — and a repository no
# team is bound to gets no dispatch pass, logged by name at boot.
[teams.primary]
name = "Example Team"
key = "EXA"
repository = "https://example.invalid/example-org/example-repo"

[teams.agent]
name = "example-agent-team"
key = "EXG"
repository = "https://example.invalid/example-org/second-repo"

# Queue states. An OPEN mapping: the five members code addresses by name are
# required present, and any additional member is legal as a pure configuration
# entry, addressable from templates, with no type or consumer change.
[queue_states]
triage = "queue:triage"
proposed = "queue:proposed"
approved = "queue:approved"
done = "queue:done"
decision = "queue:decision"

# Lifecycle states, validated exactly parallel to queue_states.
[workflow_states]
in_progress = "In Progress"
in_review = "In Review"
done = "Done"

# Repositories the operation acts on plus the chain that verifies them.
# Each step names itself and what it depends on. A step with no `depends_on`
# is a GATE: its failure is a root cause. A step whose named predecessor also
# failed is a CASCADE and is reported as one, never as an independent red.
[[repos]]
url = "https://example.invalid/example-org/example-repo"
trunk = "main"

[[repos.checks]]
name = "install"
command = "make install"

[[repos.checks]]
name = "typecheck"
command = "make type-check"
depends_on = "install"

[[repos.checks]]
name = "lint"
command = "make lint"
depends_on = "install"

[[repos.checks]]
name = "build"
command = "make build"
depends_on = "typecheck"

[[repos.checks]]
name = "test"
command = "make test"
depends_on = "build"

[[repos.checks]]
name = "test-integration"
command = "make test-integration"
depends_on = "build"

[[repos]]
url = "https://example.invalid/example-org/second-repo"
trunk = "main"

[[repos.checks]]
name = "format"
command = "make format-check"

[[repos.checks]]
name = "lint"
command = "make lint"
depends_on = "format"

[[repos.checks]]
name = "build"
command = "make build"
depends_on = "lint"

[[repos.checks]]
name = "test"
command = "make test"
depends_on = "build"

# Read-side document registry, addressed by stable key. The "checkpoint" key
# is required: the scan-window marker is addressed by key rather than by name
# so the later writer never has to match on a title.
#
# `system` and `name` are REQUIRED. An id on its own renders into a prompt as
# an opaque token, and a session given only that prompt cannot tell which
# system to open. Legal values for `system`: "tracker", "knowledge".
#
# `id` is OPTIONAL for a "tracker" document and required for a "knowledge"
# one. Boot instates the tracker documents this operation owns: it looks for
# one carrying `name`, creates it when the workspace has none, and adopts the
# id it is given — so a fresh workspace needs nothing made by hand. Declaring
# an `id` pins the entry to that exact document instead, and boot refuses when
# the workspace does not hold it or holds it under another title. DELETE the
# `id` line below when copying this file: the value is a placeholder, and boot
# will name it as an entry it cannot resolve rather than quietly creating a
# second document beside it.
[documents.checkpoint]
system = "tracker"
name = "Example Run Log"
id = "example-checkpoint-document-id"

# A knowledge-store document is not this operation's to create, so its id is
# declared rather than adopted.
[documents.house_rules]
system = "knowledge"
name = "House rules"
id = "example-house-rules-document-id"

# The operation's standing-protocol document, read by both passes. Its name
# matches the knowledge entry addressing the same document by title.
[documents.constitution]
system = "knowledge"
name = "Example — Operating Constitution"
id = "example-constitution-document-id"

# WRITE-side destination registry — where a pass records a row, as opposed to
# where it reads. Deliberately separate from `documents`: that registry is
# read-side, and a write flag on it would make it silently write-capable while
# still not saying what is written. The "run_log" key is required. `name` is
# the destination's display title — what a routine addresses its log by.
[records.run_log]
system = "knowledge"
name = "Example Run Log"
id = "example-run-log-destination-id"
append_only = true

# The grooming pass writes to a log of its own — a second entry in the same
# registry, no type or consumer change.
[records.grooming_log]
system = "knowledge"
name = "Example Grooming Log"
id = "example-grooming-log-destination-id"
append_only = true

# Reference material held in the knowledge store, addressed by key. Every
# value here belongs to the knowledge system by construction, which is what
# a template naming it must say.
[knowledge]
house_rules = "example-house-rules-knowledge-entry"
constitution = "Example — Operating Constitution"

# Named infrastructure endpoints. No endpoint string ever appears in a
# template — templates reference the key. Beside addresses this covers the
# endpoint-shaped identifiers a rendered prompt needs: the host runner's
# local address, a public documentation MCP, a connector instance id.
[endpoints]
escalation = "https://example.invalid/escalation"
host_runner = "localhost:8000"
cloudflare_docs_mcp = "https://example.invalid/docs-mcp"
notion_connector = "example-notion-connector-id"

# Initiatives the operation is steering toward. `target_date` is OPTIONAL and
# omitting it is the ordinary case: most real initiatives carry none, and a
# config that had to invent one would make its passes report a distance to a
# commitment the tracker does not hold.
[[initiatives]]
id = "example-initiative"
target_date = 2026-12-31

[[initiatives]]
id = "example-initiative-without-a-target-date"
