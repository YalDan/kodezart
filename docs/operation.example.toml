# Annotated example operation config.
#
# Pointed at by KODEZART_OPERATION_CONFIG. Parsed with stdlib tomllib; no new
# dependency. This file is ORG-SHAPED runtime configuration — deployment and
# infrastructure knobs live in AppConfig (env), cadence lives in scheduler
# configuration, and per-fire parameters are request fields. Secrets NEVER
# appear here: the model is extra="forbid", so a stray token key fails at load.
#
# Every field below is required. Validation is structural and collects every
# failure into one typed error; existence resolution against the live
# workspace belongs to the tracker adapter, not to config load.

# Human-readable name of the operation these settings describe.
operation_name = "example-operation"

# The tracker workspace the operation acts within. A slug, not a URL.
workspace = "example-workspace"

# Identities the agent posts under. Must not collide with a principal.
agent_identities = ["example-agent"]

# Prose describing the CLASS of thing this operation treats as private, read
# by the judgment half of the outbound gate. A CLASS, never a list of
# instances: an instance list stops at what the operator remembered to
# enumerate, and writing the instances down here would publish the very
# strings the gate exists to withhold. Omitting the field is legal and means
# the operator has supplied no description; enabling
# KODEZART_AGENTIC_CONTENT_SCANNER_ENABLED without one aborts boot.
private_surface = "Anything identifying the people, customers or commercial arrangements behind this operation: personal and customer names, private workspace and document addresses, revenue and pricing figures, and unreleased capabilities described by what they do rather than by their public name."

# Authority is enforced by ROLE, never by name in code or templates.
# EXACTLY ONE principal carries the approver role; validated at load.
[[principals]]
tracker_user = "example-approver"
role = "approver"

[[principals]]
tracker_user = "example-contributor"
role = "principal"

# Teams addressed from templates by key.
[teams]
primary = "EXA"

# Queue states. An OPEN mapping: the five members code addresses by name are
# required present, and any additional member is legal as a pure configuration
# entry, addressable from templates, with no type or consumer change.
[queue_states]
triage = "queue:triage"
proposed = "queue:proposed"
approved = "queue:approved"
done = "queue:done"
decision = "queue:decision"

# Lifecycle states, validated exactly parallel to queue_states.
[workflow_states]
in_progress = "In Progress"
in_review = "In Review"
done = "Done"

# Repositories the operation acts on plus the chain that verifies them.
# Each step names itself and what it depends on. A step with no `depends_on`
# is a GATE: its failure is a root cause. A step whose named predecessor also
# failed is a CASCADE and is reported as one, never as an independent red.
[[repos]]
url = "https://example.invalid/example-org/example-repo"

[[repos.check_commands]]
name = "lint"
command = "make lint"

[[repos.check_commands]]
name = "type-check"
command = "make type-check"
depends_on = "lint"

[[repos.check_commands]]
name = "test"
command = "make test"
depends_on = "type-check"

# Read-side document registry, addressed by stable key. The "checkpoint" key
# is required: the scan-window marker is addressed by key rather than by name
# so the later writer never has to match on a title.
#
# `system` is REQUIRED alongside `id`. An id on its own renders into a prompt
# as an opaque token, and a session given only that prompt cannot tell which
# system to open. Legal values: "tracker", "knowledge".
[documents.checkpoint]
system = "tracker"
id = "example-checkpoint-document-id"

[documents.house_rules]
system = "knowledge"
id = "example-house-rules-document-id"

# WRITE-side destination registry — where a pass records a row, as opposed to
# where it reads. Deliberately separate from `documents`: that registry is
# read-side, and a write flag on it would make it silently write-capable while
# still not saying what is written. The "run_log" key is required.
[records.run_log]
system = "knowledge"
id = "example-run-log-destination-id"
append_only = true

# Reference material held in the knowledge store, addressed by key. Every
# value here belongs to the knowledge system by construction, which is what
# a template naming it must say.
[knowledge]
house_rules = "example-house-rules-knowledge-entry"

# Named infrastructure endpoints. No endpoint string ever appears in a
# template — templates reference the key.
[endpoints]
escalation = "https://example.invalid/escalation"

# Initiatives the operation is steering toward. `target_date` is OPTIONAL and
# omitting it is the ordinary case: most real initiatives carry none, and a
# config that had to invent one would make its passes report a distance to a
# commitment the tracker does not hold.
[[initiatives]]
id = "example-initiative"
target_date = 2026-12-31

[[initiatives]]
id = "example-initiative-without-a-target-date"
